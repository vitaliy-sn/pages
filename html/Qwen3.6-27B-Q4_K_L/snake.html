<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE FURY — Arcade Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --neon-green: #39ff14;
    --neon-pink: #ff2d95;
    --neon-cyan: #00f0ff;
    --neon-yellow: #ffe600;
    --neon-orange: #ff6a00;
    --neon-purple: #b026ff;
    --dark-bg: #0a0a12;
    --panel-bg: #12121f;
    --grid-line: rgba(57, 255, 20, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    color: #fff;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
    pointer-events: none;
    z-index: 9999;
  }

  .arcade-cabinet {
    position: relative;
    background: var(--panel-bg);
    border: 3px solid var(--neon-green);
    border-radius: 12px;
    padding: 20px;
    box-shadow:
      0 0 30px rgba(57, 255, 20, 0.15),
      0 0 60px rgba(57, 255, 20, 0.05),
      inset 0 0 30px rgba(0,0,0,0.5);
  }

  .arcade-cabinet::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan), var(--neon-pink), var(--neon-green));
    z-index: -1;
    opacity: 0.3;
    filter: blur(8px);
  }

  .header {
    text-align: center;
    margin-bottom: 15px;
    position: relative;
  }

  .title {
    font-size: 22px;
    color: var(--neon-yellow);
    text-shadow:
      0 0 10px var(--neon-yellow),
      0 0 20px var(--neon-orange),
      0 0 40px var(--neon-orange),
      3px 3px 0 #8b4500;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 8px;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan);
    letter-spacing: 6px;
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 10px 15px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(57, 255, 20, 0.2);
    border-radius: 6px;
  }

  .stat {
    font-size: 9px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .stat-value {
    font-size: 14px;
    color: var(--neon-green);
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);
    margin-top: 3px;
    display: block;
  }

  .stat-value.score-val { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 230, 0, 0.5); }
  .stat-value.high-val { color: var(--neon-pink); text-shadow: 0 0 8px rgba(255, 45, 149, 0.5); }
  .stat-value.level-val { color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }

  .game-wrapper {
    position: relative;
    border: 2px solid rgba(57, 255, 20, 0.3);
    border-radius: 4px;
    overflow: hidden;
    background: #050508;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(5, 5, 8, 0.92);
    z-index: 10;
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-size: 20px;
    color: var(--neon-yellow);
    text-shadow: 0 0 20px var(--neon-yellow), 0 0 40px var(--neon-orange);
    margin-bottom: 20px;
    text-align: center;
    line-height: 1.6;
  }

  .overlay-sub {
    font-size: 9px;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan);
    letter-spacing: 3px;
    animation: blink 1s infinite;
  }

  .overlay-score {
    font-size: 12px;
    color: var(--neon-pink);
    text-shadow: 0 0 10px var(--neon-pink);
    margin: 15px 0;
  }

  .game-over-reason {
    font-size: 8px;
    color: #ff4444;
    text-shadow: 0 0 10px #ff4444;
    margin-top: 10px;
    letter-spacing: 2px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .controls-hint {
    text-align: center;
    margin-top: 12px;
    font-size: 7px;
    color: #555;
    letter-spacing: 2px;
    line-height: 2;
  }

  .controls-hint span {
    color: var(--neon-green);
    text-shadow: 0 0 5px rgba(57, 255, 20, 0.3);
  }

  .footer-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 12px;
    padding: 8px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 7px;
    color: #666;
    letter-spacing: 1px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .particle-canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="arcade-cabinet">
  <div class="header">
    <div class="title">SNAKE FURY</div>
    <div class="subtitle">⚡ ARCADE EDITION ⚡</div>
  </div>

  <div class="stats-bar">
    <div>
      <span class="stat">Score</span>
      <span class="stat-value score-val" id="scoreDisplay">0</span>
    </div>
    <div>
      <span class="stat">Level</span>
      <span class="stat-value level-val" id="levelDisplay">1</span>
    </div>
    <div>
      <span class="stat">Length</span>
      <span class="stat-value" id="lengthDisplay">3</span>
    </div>
    <div>
      <span class="stat">High Score</span>
      <span class="stat-value high-val" id="highScoreDisplay">0</span>
    </div>
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <canvas id="particleCanvas" class="particle-canvas" width="640" height="480"></canvas>

    <div class="overlay" id="startOverlay">
      <div class="overlay-title">SNAKE FURY</div>
      <div class="overlay-sub">PRESS [SPACE] TO START</div>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
      <div class="overlay-title">PAUSED</div>
      <div class="overlay-sub">PRESS [SPACE] TO RESUME</div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score" id="finalScore">SCORE: 0</div>
      <div class="game-over-reason" id="deathReason"></div>
      <div class="overlay-sub" style="margin-top:20px">PRESS [SPACE] TO RETRY</div>
    </div>
  </div>

  <div class="controls-hint">
    <span>W A S D</span> / <span>↑ ← ↓ →</span> MOVE &nbsp;&nbsp;|&nbsp;&nbsp; <span>SPACE</span> START / PAUSE
  </div>

  <div class="footer-bar">
    <div class="legend-item"><span class="legend-dot" style="background:#ff4444;box-shadow:0 0 6px #ff4444"></span> +10</div>
    <div class="legend-item"><span class="legend-dot" style="background:#44ff44;box-shadow:0 0 6px #44ff44"></span> +20</div>
    <div class="legend-item"><span class="legend-dot" style="background:#4488ff;box-shadow:0 0 6px #4488ff"></span> +30</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ffaa00;box-shadow:0 0 6px #ffaa00"></span> +50</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ff26ff;box-shadow:0 0 6px #ff26ff"></span> +100</div>
  </div>
</div>

<script>
(() => {
  // ─── CONFIG ───────────────────────────────────────────────
  const COLS = 32;
  const ROWS = 24;
  const CELL = 20;
  const CANVAS_W = COLS * CELL;
  const CANVAS_H = ROWS * CELL;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const pCanvas = document.getElementById('particleCanvas');
  const pCtx = pCanvas.getContext('2d');

  canvas.width = pCanvas.width = CANVAS_W;
  canvas.height = pCanvas.height = CANVAS_H;

  // ─── STATE ────────────────────────────────────────────────
  let snake, direction, nextDirection, food, score, highScore, level;
  let gameState; // 'idle' | 'playing' | 'paused' | 'dead'
  let lastTime, tickAccumulator, tickInterval;
  let particles = [];
  let screenShake = 0;
  let flashAlpha = 0;
  let comboCount = 0;
  let comboTimer = 0;
  let foodPulse = 0;
  let animFrame;

  highScore = parseInt(localStorage.getItem('snakeFuryHigh') || '0');
  document.getElementById('highScoreDisplay').textContent = highScore;

  // ─── FOOD TYPES ──────────────────────────────────────────
  const FOOD_TYPES = [
    { name: 'apple',      color: '#ff4444', glow: '#ff2222', points: 10, weight: 40, shape: 'circle' },
    { name: 'energy',     color: '#44ff44', glow: '#22ff22', points: 20, weight: 25, shape: 'diamond' },
    { name: 'crystal',    color: '#4488ff', glow: '#2266ff', points: 30, weight: 18, shape: 'hexagon' },
    { name: 'gold',       color: '#ffaa00', glow: '#ff8800', points: 50, weight: 12, shape: 'star' },
    { name: 'diamond',    color: '#ff26ff', glow: '#ff00ff', points: 100, weight: 5, shape: 'crown' },
  ];

  function weightedRandom() {
    const total = FOOD_TYPES.reduce((s, f) => s + f.weight, 0);
    let r = Math.random() * total;
    for (const ft of FOOD_TYPES) {
      r -= ft.weight;
      if (r <= 0) return ft;
    }
    return FOOD_TYPES[0];
  }

  // ─── INIT ─────────────────────────────────────────────────
  function initGame() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      { x: midX, y: midY },
      { x: midX - 1, y: midY },
      { x: midX - 2, y: midY },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    level = 1;
    comboCount = 0;
    comboTimer = 0;
    particles = [];
    screenShake = 0;
    flashAlpha = 0;
    tickInterval = 130;
    tickAccumulator = 0;
    spawnFood();
    updateUI();
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let attempts = 0;
    do {
      food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS),
        type: weightedRandom(),
        spawnTime: performance.now(),
      };
      attempts++;
    } while (occupied.has(`${food.x},${food.y}`) && attempts < 1000);
  }

  // ─── GAME LOOP ────────────────────────────────────────────
  function gameLoop(timestamp) {
    animFrame = requestAnimationFrame(gameLoop);
    if (!lastTime) lastTime = timestamp;
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    if (gameState === 'playing') {
      tickAccumulator += dt;
      comboTimer = Math.max(0, comboTimer - dt);
      if (comboTimer <= 0) comboCount = 0;

      while (tickAccumulator >= tickInterval) {
        tickAccumulator -= tickInterval;
        update();
      }
    }

    foodPulse += dt * 0.003;
    updateParticles(dt);
    screenShake = Math.max(0, screenShake - dt * 0.03);
    flashAlpha = Math.max(0, flashAlpha - dt * 0.004);

    render();
    renderParticles();
  }

  // ─── UPDATE ───────────────────────────────────────────────
  function update() {
    direction = { ...nextDirection };

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y,
    };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      die('WALL IMPACT');
      return;
    }

    // Self collision
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        die('SELF DESTRUCTION');
        return;
      }
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
      const pts = food.type.points * (comboCount > 0 ? 1 + comboCount * 0.5 : 1);
      score += Math.floor(pts);
      comboCount++;
      comboTimer = 2000;

      spawnEatEffect(head.x, head.y, food.type);
      screenShake = Math.min(screenShake + 3, 8);
      flashAlpha = Math.min(flashAlpha + 0.15, 0.4);

      // Level up every 100 points
      const newLevel = Math.floor(score / 100) + 1;
      if (newLevel > level) {
        level = newLevel;
        tickInterval = Math.max(50, 130 - (level - 1) * 8);
      }

      spawnFood();
      updateUI();
    } else {
      snake.pop();
    }
  }

  function die(reason) {
    gameState = 'dead';
    screenShake = 12;
    flashAlpha = 0.6;

    // Death particles
    for (const seg of snake) {
      for (let i = 0; i < 5; i++) {
        particles.push(createParticle(seg.x * CELL + CELL/2, seg.y * CELL + CELL/2, '#ff4444', 'explode'));
      }
    }

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeFuryHigh', highScore);
    }

    document.getElementById('finalScore').textContent = `SCORE: ${score}`;
    document.getElementById('deathReason').textContent = reason;
    document.getElementById('highScoreDisplay').textContent = highScore;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
  }

  // ─── PARTICLES ────────────────────────────────────────────
  function createParticle(x, y, color, type) {
    const angle = Math.random() * Math.PI * 2;
    const speed = type === 'explode' ? (2 + Math.random() * 4) : (1 + Math.random() * 2);
    return {
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      size: type === 'explode' ? (2 + Math.random() * 4) : (3 + Math.random() * 5),
      color,
      type,
      gravity: type === 'explode' ? 0.05 : 0,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
    };
  }

  function spawnEatEffect(cx, cy, foodType) {
    const px = cx * CELL + CELL / 2;
    const py = cy * CELL + CELL / 2;

    // Burst ring
    for (let i = 0; i < 20; i++) {
      const angle = (Math.PI * 2 / 20) * i;
      const speed = 3 + Math.random() * 2;
      particles.push({
        x: px, y: py,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.01,
        size: 2 + Math.random() * 3,
        color: foodType.color,
        type: 'ring',
        gravity: 0,
        rotation: 0,
        rotSpeed: 0,
      });
    }

    // Sparkles
    for (let i = 0; i < 12; i++) {
      particles.push(createParticle(px, py, foodType.glow, 'explode'));
    }

    // Score popup
    particles.push({
      x: px, y: py - 10,
      vx: 0, vy: -1.5,
      life: 1,
      decay: 0.012,
      size: 0,
      color: foodType.color,
      type: 'text',
      text: `+${foodType.points}${comboCount > 1 ? ' x' + comboCount : ''}`,
      gravity: 0,
      rotation: 0,
      rotSpeed: 0,
    });

    // Combo text
    if (comboCount > 2) {
      particles.push({
        x: px, y: py - 30,
        vx: 0, vy: -0.8,
        life: 1,
        decay: 0.01,
        size: 0,
        color: '#ffe600',
        type: 'text',
        text: `COMBO x${comboCount}!`,
        gravity: 0,
        rotation: 0,
        rotSpeed: 0,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.life -= p.decay;
      p.rotation += p.rotSpeed;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ─── RENDER ───────────────────────────────────────────────
  function render() {
    ctx.save();

    // Screen shake
    if (screenShake > 0) {
      const sx = (Math.random() - 0.5) * screenShake * 2;
      const sy = (Math.random() - 0.5) * screenShake * 2;
      ctx.translate(sx, sy);
    }

    // Background
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Grid
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.035)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, CANVAS_H);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(CANVAS_W, y * CELL);
      ctx.stroke();
    }

    // Border glow
    ctx.shadowColor = 'rgba(57, 255, 20, 0.3)';
    ctx.shadowBlur = 15;
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.15)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, CANVAS_W - 2, CANVAS_H - 2);
    ctx.shadowBlur = 0;

    // Food
    renderFood();

    // Snake
    renderSnake();

    // Flash
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    ctx.restore();
  }

  function renderFood() {
    const px = food.x * CELL + CELL / 2;
    const py = food.y * CELL + CELL / 2;
    const age = (performance.now() - food.spawnTime) / 1000;
    const pulse = 1 + Math.sin(foodPulse * 3) * 0.15;
    const bob = Math.sin(foodPulse * 2) * 2;

    ctx.save();
    ctx.translate(px, py + bob);
    ctx.scale(pulse, pulse);

    // Glow
    ctx.shadowColor = food.type.glow;
    ctx.shadowBlur = 15 + Math.sin(foodPulse * 4) * 5;

    const s = CELL * 0.4;

    switch (food.type.shape) {
      case 'circle':
        ctx.fillStyle = food.type.color;
        ctx.beginPath();
        ctx.arc(0, 0, s, 0, Math.PI * 2);
        ctx.fill();
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(-s * 0.25, -s * 0.25, s * 0.35, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 'diamond':
        ctx.fillStyle = food.type.color;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s, 0);
        ctx.lineTo(0, s);
        ctx.lineTo(-s, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.5);
        ctx.lineTo(s * 0.3, 0);
        ctx.lineTo(0, s * 0.2);
        ctx.lineTo(-s * 0.3, 0);
        ctx.closePath();
        ctx.fill();
        break;

      case 'hexagon':
        ctx.fillStyle = food.type.color;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 3) * i - Math.PI / 6;
          ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(-s * 0.2, -s * 0.2, s * 0.3, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 'star':
        ctx.fillStyle = food.type.color;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const outerA = (Math.PI * 2 / 5) * i - Math.PI / 2;
          const innerA = outerA + Math.PI / 5;
          ctx.lineTo(Math.cos(outerA) * s, Math.sin(outerA) * s);
          ctx.lineTo(Math.cos(innerA) * s * 0.45, Math.sin(innerA) * s * 0.45);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(0, -s * 0.15, s * 0.25, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 'crown':
        ctx.fillStyle = food.type.color;
        ctx.beginPath();
        ctx.moveTo(-s, s * 0.5);
        ctx.lineTo(-s, -s * 0.2);
        ctx.lineTo(-s * 0.5, s * 0.1);
        ctx.lineTo(0, -s);
        ctx.lineTo(s * 0.5, s * 0.1);
        ctx.lineTo(s, -s * 0.2);
        ctx.lineTo(s, s * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(0, -s * 0.3, s * 0.2, 0, Math.PI * 2);
        ctx.fill();
        break;
    }

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function renderSnake() {
    const len = snake.length;

    // Body segments (draw from tail to head)
    for (let i = len - 1; i >= 1; i--) {
      const seg = snake[i];
      const t = i / len;
      const px = seg.x * CELL;
      const py = seg.y * CELL;

      // Color gradient from tail to head
      const r = Math.floor(20 + t * 20);
      const g = Math.floor(180 + t * 75);
      const b = Math.floor(10 + t * 10);
      const color = `rgb(${r},${g},${b})`;

      const pad = 1 + t * 1.5;
      const size = CELL - pad * 2;

      ctx.fillStyle = color;
      ctx.shadowColor = 'rgba(57, 255, 20, 0.2)';
      ctx.shadowBlur = 4;

      // Rounded rect
      const radius = 3;
      const x = px + pad;
      const y = py + pad;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + size - radius, y);
      ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
      ctx.lineTo(x + size, y + size - radius);
      ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
      ctx.lineTo(x + radius, y + size);
      ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();

      // Scale pattern on every other segment
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(25,255,255,0.06)';
        ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
      }

      ctx.shadowBlur = 0;
    }

    // Head
    const head = snake[0];
    const hx = head.x * CELL;
    const hy = head.y * CELL;

    // Head glow
    ctx.shadowColor = 'rgba(57, 255, 20, 0.6)';
    ctx.shadowBlur = 12;

    // Head shape
    ctx.fillStyle = '#22dd44';
    const hp = 0.5;
    const hs = CELL - hp * 2;
    const hr = 5;
    const hx2 = hx + hp;
    const hy2 = hy + hp;
    ctx.beginPath();
    ctx.moveTo(hx2 + hr, hy2);
    ctx.lineTo(hx2 + hs - hr, hy2);
    ctx.quadraticCurveTo(hx2 + hs, hy2, hx2 + hs, hy2 + hr);
    ctx.lineTo(hx2 + hs, hy2 + hs - hr);
    ctx.quadraticCurveTo(hx2 + hs, hy2 + hs, hx2 + hs - hr, hy2 + hs);
    ctx.lineTo(hx2 + hr, hy2 + hs);
    ctx.quadraticCurveTo(hx2, hy2 + hs, hx2, hy2 + hs - hr);
    ctx.lineTo(hx2, hy2 + hr);
    ctx.quadraticCurveTo(hx2, hy2, hx2 + hr, hy2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // Head highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(hx2 + 2, hy2 + 2, hs * 0.5, hs * 0.4);

    // Eyes
    const eyeSize = 4;
    const pupilSize = 2;
    let eye1x, eye1y, eye2x, eye2y;

    if (direction.x === 1) {
      eye1x = hx + CELL * 0.65; eye1y = hy + CELL * 0.3;
      eye2x = hx + CELL * 0.65; eye2y = hy + CELL * 0.7;
    } else if (direction.x === -1) {
      eye1x = hx + CELL * 0.35; eye1y = hy + CELL * 0.3;
      eye2x = hx + CELL * 0.35; eye2y = hy + CELL * 0.7;
    } else if (direction.y === -1) {
      eye1x = hx + CELL * 0.3; eye1y = hy + CELL * 0.35;
      eye2x = hx + CELL * 0.7; eye2y = hy + CELL * 0.35;
    } else {
      eye1x = hx + CELL * 0.3; eye1y = hy + CELL * 0.65;
      eye2x = hx + CELL * 0.7; eye2y = hy + CELL * 0.65;
    }

    // Eye whites
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eye1x, eye1y, eyeSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eye2x, eye2y, eyeSize, 0, Math.PI * 2);
    ctx.fill();

    // Pupils
    const pupOff = 1.2;
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(eye1x + direction.x * pupOff, eye1y + direction.y * pupOff, pupilSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eye2x + direction.x * pupOff, eye2y + direction.y * pupOff, pupilSize, 0, Math.PI * 2);
    ctx.fill();

    // Tongue (forked)
    if (gameState === 'playing') {
      const tonguePhase = Math.sin(performance.now() * 0.008);
      if (tonguePhase > 0.3) {
        const tx = hx + CELL / 2 + direction.x * CELL * 0.5;
        const ty = hy + CELL / 2 + direction.y * CELL * 0.5;
        const tLen = 6 + tonguePhase * 4;

        ctx.strokeStyle = '#ff3333';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(hx + CELL / 2 + direction.x * CELL * 0.45, hy + CELL / 2 + direction.y * CELL * 0.45);
        ctx.lineTo(tx, ty);
        ctx.stroke();

        // Fork
        const perpX = -direction.y;
        const perpY = direction.x;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + direction.x * tLen * 0.5 + perpX * tLen * 0.35, ty + direction.y * tLen * 0.5 + perpY * tLen * 0.35);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + direction.x * tLen * 0.5 - perpX * tLen * 0.35, ty + direction.y * tLen * 0.5 - perpY * tLen * 0.35);
        ctx.stroke();
      }
    }
  }

  function renderParticles() {
    pCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    for (const p of particles) {
      pCtx.save();
      pCtx.globalAlpha = Math.max(0, p.life);
      pCtx.translate(p.x, p.y);
      pCtx.rotate(p.rotation);

      if (p.type === 'text') {
        pCtx.font = 'bold 10px "Press Start 2P", monospace';
        pCtx.fillStyle = p.color;
        pCtx.shadowColor = p.color;
        pCtx.shadowBlur = 8;
        pCtx.textAlign = 'center';
        pCtx.fillText(p.text, 0, 0);
      } else {
        pCtx.fillStyle = p.color;
        pCtx.shadowColor = p.color;
        pCtx.shadowBlur = 6;
        pCtx.beginPath();
        pCtx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
        pCtx.fill();
      }

      pCtx.restore();
    }
  }

  // ─── UI ───────────────────────────────────────────────────
  function updateUI() {
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('levelDisplay').textContent = level;
    document.getElementById('lengthDisplay').textContent = snake.length;
  }

  // ─── INPUT ────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Space
    if (e.code === 'Space') {
      e.preventDefault();
      handleSpace();
      return;
    }

    if (gameState !== 'playing') return;

    // Direction keys — using e.code, layout independent
    switch (e.code) {
      case 'ArrowUp':
      case 'KeyW':
        if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
        e.preventDefault();
        break;
      case 'ArrowDown':
      case 'KeyS':
        if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
        e.preventDefault();
        break;
      case 'ArrowLeft':
      case 'KeyA':
        if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
        e.preventDefault();
        break;
      case 'ArrowRight':
      case 'KeyD':
        if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
        e.preventDefault();
        break;
    }
  });

  function handleSpace() {
    switch (gameState) {
      case 'idle':
        gameState = 'playing';
        initGame();
        document.getElementById('startOverlay').classList.add('hidden');
        break;
      case 'playing':
        gameState = 'paused';
        document.getElementById('pauseOverlay').classList.remove('hidden');
        break;
      case 'paused':
        gameState = 'playing';
        document.getElementById('pauseOverlay').classList.add('hidden');
        break;
      case 'dead':
        gameState = 'playing';
        initGame();
        document.getElementById('gameOverOverlay').classList.add('hidden');
        break;
    }
  }

  // ─── START ────────────────────────────────────────────────
  gameState = 'idle';
  initGame();
  document.getElementById('startOverlay').classList.remove('hidden');
  requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
